# Local fresh-install example; adapt volumes to an existing deployment before upgrading.
# For Erugo, ConvertX, Collabora, ClamAV and REST bridge see deploy/examples/compose.integrations.yaml.
services:
  filebrowser:
    container_name: filebrowser
    image: filebrowser-custom:3.3.1
    build:
      context: .
      dockerfile: Dockerfile.source
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      FB_ADDRESS: "0.0.0.0"
      FB_PORT: "80"
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
    volumes:
      - filebrowser-files:/srv
      - filebrowser-database:/database
      - filebrowser-config:/config
volumes:
  filebrowser-files:
  filebrowser-database:
  filebrowser-config:
